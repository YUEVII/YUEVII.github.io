    Projects:
      - name: RoboStressBench
        summary: Built a benchmark for evaluating VLM robustness under physical visual stress in embodied scenes.
        highlights:
          - Organized physical visual stress around Material, Viewpoint, Lighting, and Geometry factors.
          - Supports VQA and grounding-style embodied evaluation.
        start_date: 2026

      - name: Robot Laundry Folding Under Dynamic Visual Interference
        summary: Built an embodied AI system for folding clothes under dynamic TV backgrounds and complex colored lighting.
        highlights:
          - Designed the scene, perception-control workflow, and evaluation process.
          - Demonstrated stable folding of short-sleeve and long-sleeve clothes in high-noise visual environments.
        start_date: 2025-12
        end_date: 2026-04

      - name: AnimationBench
        summary: First-author benchmark project for evaluating character-centric animation in video models.
        highlights:
          - Focuses on IP preservation, animation principles, and broader quality dimensions.
        start_date: 2026

